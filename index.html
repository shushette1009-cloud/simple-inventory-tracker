<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventory Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>📦 Inventory Tracker</h1>
    <button class="btn ghost" id="exportBtn" type="button">Export CSV</button>
  </header>

  <section class="stats">
    <div class="stat"><span>Products</span><strong id="statProducts">0</strong></div>
    <div class="stat"><span>Units in stock</span><strong id="statUnits">0</strong></div>
    <div class="stat"><span>Stock value (cost)</span><strong id="statValue">₱0.00</strong></div>
    <div class="stat warn"><span>Low / out of stock</span><strong id="statLow">0</strong></div>
  </section>

  <div class="grid">
    <div>
      <div class="card">
        <h2 id="formTitle">Add product</h2>
        <form id="productForm" autocomplete="off">
          <input type="hidden" id="editId">
          <input id="pSku" placeholder="SKU / barcode (optional)">
          <input id="pName" placeholder="Product name" required>
          <input id="pCategory" placeholder="Category (e.g. Snacks, Drinks)">
          <div class="two">
            <input id="pCost" type="number" step="0.01" min="0" placeholder="Cost price" required>
            <input id="pPrice" type="number" step="0.01" min="0" placeholder="Selling price" required>
          </div>
          <div class="two">
            <input id="pQty" type="number" step="1" min="0" placeholder="Opening qty" required>
            <input id="pReorder" type="number" step="1" min="0" placeholder="Reorder level" required>
          </div>
          <div class="row">
            <button class="btn" type="submit" id="saveBtn">Add product</button>
            <button class="btn ghost" type="button" id="cancelEdit" hidden>Cancel</button>
          </div>
          <p id="productMsg" class="msg"></p>
        </form>
      </div>

      <div class="card">
        <h2>Stock movement</h2>
        <form id="moveForm" autocomplete="off">
          <select id="mProduct" required></select>
          <select id="mType">
            <option value="in">Stock in (delivery / restock)</option>
            <option value="out">Stock out (sale / use)</option>
            <option value="adjust">Set exact count (stocktake)</option>
          </select>
          <input id="mQty" type="number" step="1" min="0" placeholder="Quantity" required>
          <input id="mNote" placeholder="Note (optional)">
          <button class="btn" type="submit">Save movement</button>
          <p id="moveMsg" class="msg"></p>
        </form>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="row between" style="margin-bottom:12px">
          <h2 style="margin:0">Products</h2>
          <div class="row">
            <input id="search" placeholder="Search name, SKU, category" style="max-width:220px">
            <select id="filter" style="max-width:150px">
              <option value="all">All</option>
              <option value="low">Low / out</option>
            </select>
          </div>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Reorder</th><th class="num">Price</th><th></th></tr></thead>
            <tbody id="productBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card" id="logCard" hidden>
        <h2 id="logTitle"></h2>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Date</th><th>Movement</th><th class="num">Change</th><th class="num">Qty after</th><th>Note</th></tr></thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
